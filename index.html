<script>
const key='phillyHalalStoresV1';
const allFields=[...document.querySelectorAll('.field')];
function money(n){return Number.isFinite(n)?n.toFixed(2):''}
function recalc(){
 let sum=0;
 document.querySelectorAll('[data-type="qty"]').forEach(q=>{
   const side=q.dataset.side, i=q.dataset.i;
   const wt=document.querySelector(`[data-side="${side}"][data-i="${i}"][data-type="wt"]`);
   const price=document.querySelector(`[data-side="${side}"][data-i="${i}"][data-type="price"]`);
   const total=document.querySelector(`[data-side="${side}"][data-i="${i}"][data-type="total"]`);
   const a=parseFloat(q.value), b=parseFloat(wt.value), c=parseFloat(price.value);
   if(Number.isFinite(a)&&Number.isFinite(b)&&Number.isFinite(c)){
     const t=a*b*c; total.value=money(t); sum+=t;
   } else total.value='';
 });
 grandTotal.value=money(sum);
 const old=parseFloat(oldBalance.value)||0;
 amountDue.value=money(sum+old);
}
allFields.forEach(f=>f.addEventListener('input',recalc));
function setDate(){
 const d=new Date();
 date.value=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function newInvoice(){
 allFields.forEach(f=>{
   if(f.id==='date') return;
   if(f.type==='checkbox') f.checked=false;
   else f.value='';
 });
 setDate(); recalc();
}
function getStores(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}
function refreshStores(){
 const s=document.getElementById('storeSelect');
 s.innerHTML='<option value="">STORES</option>';
 getStores().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)});
}
function saveStore(){
 const v=soldTo.value.trim(); if(!v){alert('Enter the store name first.');return}
 const a=getStores(); if(!a.includes(v)){a.push(v);localStorage.setItem(key,JSON.stringify(a))}
 refreshStores(); storeSelect.value=v;
}
function chooseStore(){if(storeSelect.value) soldTo.value=storeSelect.value}
paid.addEventListener('change',()=>{if(paid.checked)notpaid.checked=false});
notpaid.addEventListener('change',()=>{if(notpaid.checked)paid.checked=false});
setDate(); refreshStores(); recalc();
</script>
